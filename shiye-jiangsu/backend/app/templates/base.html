<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}江苏事业单位智能选岗系统{% endblock %}</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    
    <style>
        :root {
            --primary: #2563EB;
            --primary-hover: #1D4ED8;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        }
        
        .gradient-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .gradient-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }
        
        .gradient-warning {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }
        
        .gradient-info {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        }
    </style>
    
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-gray-50">
    <!-- 导航栏 -->
    <nav class="bg-white shadow-sm border-b sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="{{ url_for('index.home') }}" class="flex items-center space-x-3">
                        <div class="w-10 h-10 gradient-primary rounded-lg flex items-center justify-center">
                            <i data-lucide="briefcase" class="w-6 h-6 text-white"></i>
                        </div>
                        <div>
                            <div class="text-lg font-bold text-gray-900">江苏事业单位</div>
                            <div class="text-xs text-gray-500">智能选岗系统</div>
                        </div>
                    </a>
                </div>
                
                <div class="flex items-center space-x-6">
                    <a href="{{ url_for('index.home') }}" class="text-gray-700 hover:text-blue-600 font-medium transition">
                        <i data-lucide="home" class="w-4 h-4 inline mr-1"></i>首页
                    </a>
                    <a href="{{ url_for('wizard.index') }}" class="text-blue-600 hover:text-blue-800 font-bold transition">
                        <i data-lucide="wand-2" class="w-4 h-4 inline mr-1"></i>智能选岗
                    </a>
                    <a href="{{ url_for('positions.list_positions') }}" class="text-gray-700 hover:text-blue-600 font-medium transition">
                        <i data-lucide="search" class="w-4 h-4 inline mr-1"></i>岗位查询
                    </a>
                    <a href="{{ url_for('positions.dashboard') }}" class="text-gray-700 hover:text-blue-600 font-medium transition">
                        <i data-lucide="bar-chart-3" class="w-4 h-4 inline mr-1"></i>数据分析
                    </a>
                    <a href="{{ url_for('comparison.cities') }}" class="text-gray-700 hover:text-blue-600 font-medium transition">
                        <i data-lucide="git-compare" class="w-4 h-4 inline mr-1"></i>地市对比
                    </a>
                    <div class="relative" x-data="{ open: false }">
                        <button @click="open = !open" class="text-gray-700 hover:text-blue-600 font-medium transition flex items-center">
                            <i data-lucide="book-open" class="w-4 h-4 inline mr-1"></i>
                            考试指南
                            <i data-lucide="chevron-down" class="w-4 h-4 ml-1"></i>
                        </button>
                        <div x-show="open" @click.away="open = false" 
                             class="absolute top-full mt-2 w-48 bg-white rounded-lg shadow-xl py-2 z-50"
                             style="display: none;">
                            <a href="{{ url_for('policy.faq') }}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-blue-50 hover:text-blue-600">
                                <i data-lucide="help-circle" class="w-4 h-4 inline mr-2"></i>政策解答
                            </a>
                            <a href="{{ url_for('exam.syllabus') }}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-blue-50 hover:text-blue-600">
                                <i data-lucide="file-text" class="w-4 h-4 inline mr-2"></i>考试大纲
                            </a>
                            <a href="{{ url_for('exam.preparation') }}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-blue-50 hover:text-blue-600">
                                <i data-lucide="book" class="w-4 h-4 inline mr-2"></i>备考指南
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    
    <!-- 主内容 -->
    <main class="min-h-screen">
        {% block content %}{% endblock %}
    </main>
    
    <!-- 页脚 -->
    <footer class="bg-white border-t mt-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="text-center text-gray-500 text-sm">
                <p>江苏事业单位智能选岗系统 v1.0</p>
                <p class="mt-1">数据来源：2025年江苏省事业单位统考岗位表 | 自动导入竞争比与进面分</p>
            </div>
        </div>
    </footer>
    
    <script>
        // 初始化图标
        lucide.createIcons();
    </script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
